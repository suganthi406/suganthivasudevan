<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Multiplication</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        input {
            width: 50px;
            padding: 8px;
            margin: 5px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Matrix Multiplication</h1>

    <h3>Matrix A</h3>
    <input type="number" id="a11">
    <input type="number" id="a12"><br>

    <input type="number" id="a21">
    <input type="number" id="a22">

    <h3>Matrix B</h3>
    <input type="number" id="b11">
    <input type="number" id="b12"><br>

    <input type="number" id="b21">
    <input type="number" id="b22">

    <br>

    <button onclick="multiplyMatrices()">Multiply Matrices</button>

    <div id="result"></div>

    <script>
        function multiplyMatrices() {

            // Get values of Matrix A
            let a11 = Number(document.getElementById("a11").value);
            let a12 = Number(document.getElementById("a12").value);
            let a21 = Number(document.getElementById("a21").value);
            let a22 = Number(document.getElementById("a22").value);

            // Get values of Matrix B
            let b11 = Number(document.getElementById("b11").value);
            let b12 = Number(document.getElementById("b12").value);
            let b21 = Number(document.getElementById("b21").value);
            let b22 = Number(document.getElementById("b22").value);

            // Matrix multiplication
            let c11 = a11 * b11 + a12 * b21;
            let c12 = a11 * b12 + a12 * b22;
            let c21 = a21 * b11 + a22 * b21;
            let c22 = a21 * b12 + a22 * b22;

            // Display result
            document.getElementById("result").innerHTML =
                "Result:<br><br>" +
                c11 + " &nbsp;&nbsp; " + c12 + "<br>" +
                c21 + " &nbsp;&nbsp; " + c22;
        }
    </script>

</body>
</html>
